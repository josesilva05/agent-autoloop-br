name: Decidir se esta mudança vai para produção
description: Compara a versão saudável com o commit de destino e preserva as mudanças de código ainda não publicadas
inputs:
  target:
    description: Hash de commit completo a publicar; o padrão é github.sha
    required: false
  test-local-health:
    description: Apenas para testes; permite que a verificação de saúde use http://127.0.0.1
    default: "false"
outputs:
  release:
    description: Se é preciso publicar
    value: ${{ steps.scope.outputs.release }}
  superseded:
    description: Se a main mais nova já contém código que precisa de uma publicação separada
    value: ${{ steps.scope.outputs.superseded }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"
    - id: scope
      shell: bash
      env:
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_TEST_LOCAL_HEALTH: ${{ inputs.test-local-health }}
      run: node --disable-warning=ExperimentalWarning "$GITHUB_ACTION_PATH/action.ts"
