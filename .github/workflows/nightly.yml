name: nightly
# Uma execução solicitada por commit aparece listada sob o commit mais recente do branch, então o nome dela diz qual foi verificado.
run-name: ${{ inputs.commit && format('nightly {0}', inputs.commit) || 'nightly' }}
on:
  schedule:
    - cron: "23 18 * * *"
  workflow_dispatch:
    inputs:
      commit:
        description: Commit a verificar; se ficar vazio, usa o mais recente deste branch
        required: false
  pull_request:
    paths:
      - .github/workflows/nightly.yml
      - sim/**

permissions:
  contents: read

jobs:
  # A simulação longa, as mortes reais de processo e as condições de kernel corrompido: lentas demais para travar cada merge.
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      # Um pull request que altera este arquivo ou sim/ recebe as mortes de processo e as mutações; as execuções longas esperam o agendamento.
      - if: github.event_name != 'pull_request'
        run: npm test
      - run: npm run test:deep
  # A instalação exige Node 24 ou mais novo, e todas as outras verificações rodam em 24.
  newest-node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: latest
          package-manager-cache: false
      - run: npm ci
      - if: runner.os != 'Windows'
        run: npm run test:quick
      - if: runner.os == 'Windows'
        run: npm run test:windows
      - if: runner.os != 'Windows'
        run: sh scripts/install-smoke.sh
      - if: runner.os == 'Windows'
        run: node --disable-warning=ExperimentalWarning scripts/install-smoke-windows.ts
