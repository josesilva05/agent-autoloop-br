name: Sugestão de funcionalidade / Feature request
description: Proponha uma funcionalidade ou melhoria com cenário de uso bem definido.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Ideias ainda em exploração podem ser discutidas em [Troca de ideias](https://github.com/josesilva05/agent-autoloop-br/discussions/categories/ideas).
        Novos Agents, fontes e canais se conectam por plugins; o kernel se mantém sem dependências de runtime e a interface é fornecida por clientes independentes.
  - type: textarea
    id: problem
    attributes:
      label: Cenário de uso e problema encontrado
      description: Quem precisa disso e em que situação? O que é incômodo hoje?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Como você gostaria que melhorasse
      description: Descreva o comportamento ou resultado esperado; pode anexar exemplos concretos.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas já tentadas (opcional)
      description: Por que as regras, os plugins ou as receitas atuais não atendem à necessidade?
