name: Relato de problema / Bug report
description: Relate uma falha reproduzível para ajudar a localizar e corrigir.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Problemas de instalação e configuração também podem ser discutidos em [Perguntas de uso](https://github.com/josesilva05/agent-autoloop-br/discussions/categories/q-a).
        Problemas de segurança: contate os mantenedores conforme as [instruções de segurança](https://github.com/josesilva05/agent-autoloop-br/blob/main/SECURITY.md).
        Não envie chaves, links de cartão com permissão, configurações completas, bancos de dados nem materiais reais de negócio.
  - type: input
    id: version
    attributes:
      label: Versão do programa
      description: Informe a saída de agent-autoloop --version e a data da instalação ou atualização; ao rodar a partir do código-fonte, anexe o número do commit.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Ambiente de execução
      description: Sistema, versão do Node.js, Agent ou plugin relacionado e se a execução é local ou em worker remoto.
      placeholder: macOS / Linux / Windows; node --version; nome e versão do Agent; canais relacionados.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Passos de reprodução
      description: Informe o menor número de passos possível; ao precisar de exemplo de regra, use dados fictícios e placeholders.
      placeholder: |
        1. Configurar...
        2. Executar...
        3. Ocorre...
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Resultado esperado e resultado obtido
      placeholder: Esperado...; obtido...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Log ou captura de tela (opcional)
      description: Pode anexar trechos relevantes de doctor, status ou why; remova antes informações pessoais, corpo de negócio e credenciais.
